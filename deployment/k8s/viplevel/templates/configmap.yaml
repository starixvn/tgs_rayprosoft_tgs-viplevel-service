apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "viplevel.fullname" . }}
data:
  appsettings.json: |
    {}
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json",
          "FormatterOptions": {
            "IncludeScopes": "True",
            "TimestampFormat": "HH:mm:ss "
          }
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
