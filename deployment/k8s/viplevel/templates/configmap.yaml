apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "viplevel.fullname" . }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.VipLevelService.Messages": "Information",
          "Tgs.VipLevelService.ApplicationServices": "Information"
        }
      },
      "VipLevelConnectionStrings": {
        "CashServiceClientBaseUrl": "http://cashservice-api",
        "PlayerBucketClientBaseUrl": "http://tgs-playerbucket-service",
        "PaymentServiceClientBaseUrl": "http://payment-api",
        "GameWagersClientBaseUrl": "http://game-gamewagers"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]